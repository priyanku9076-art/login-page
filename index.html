<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Container (Centered using Flexbox, 100vh) -->
    <div class="login-container">
        
        <!-- Left Section: Illustration / Image -->
        <div class="left-section">
            <img src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=600&q=80" alt="Login Illustration">
        </div>

        <!-- Right Section: Login Form -->
        <div class="right-section">
            <div class="form-content">
                <!-- Heading and Description -->
                <h2>Hello Again!</h2>
                <p class="subtitle">Welcome back! We missed you!</p>

                <!-- Form Inputs -->
                <form>
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Email@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="forgot-password">Forgot Password</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="login-btn">Login</button>
                </form>

                <p class="signup-text">Not a member? <a href="#">Register Now</a></p>
            </div>
        </div>

    </div>

</body>
</html>
